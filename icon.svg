<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#191c28"/>
      <stop offset="100%" stop-color="#07080b"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle gold border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Center Stylized 'VBE' Chart & Diamond -->
  <!-- Bar chart bars -->
  <rect x="150" y="270" width="40" height="90" rx="8" fill="#F59E0B"/>
  <rect x="210" y="210" width="40" height="150" rx="8" fill="#FBBF24"/>
  <rect x="270" y="160" width="40" height="200" rx="8" fill="#FDE68A"/>
  <rect x="330" y="240" width="40" height="120" rx="8" fill="#D97706"/>

  <!-- Trend line with glow -->
  <polyline points="170,250 230,190 290,140 350,220" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="290" cy="140" r="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4"/>
</svg>
